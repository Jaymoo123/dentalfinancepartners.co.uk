name: Caretaker

# The weekly REASONING layer over the monitoring stack. state_check gathers
# facts daily; this investigates them, runs the end-to-end probes, and on the
# first run of each month audits the monitors themselves (which fired, which
# watch something dead, which should be killed). Contract: .github/caretaker/PROMPT.md
#
# Read-only by contract. Emails only when the finding set changes - the dedup
# exists because a monitor that emails every week gets ignored (risk-manager's
# fate). Its own death is covered by the HEARTBEAT_CARETAKER dead-man switch.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, an hour after state-check
  workflow_dispatch: {}

jobs:
  caretaker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: |
          pip install --quiet httpx python-dotenv
          npm install -g @anthropic-ai/claude-code

      - name: Restore monitoring memory (state-check snapshots + dedup keys)
        uses: actions/cache@v4
        with:
          path: out
          key: state-check-caretaker-${{ github.run_id }}
          restore-keys: state-check-

      - name: Fresh state check (facts must be today's, not Friday's)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/state_check.py --json > out/run.json || true

      - name: End-to-end probes (money path + sitemap)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LEAD_PROBE_SECRET: ${{ secrets.LEAD_PROBE_SECRET }}
        run: |
          mkdir -p out/probes
          node scripts/property_health_sweep.mjs > out/probes/health_sweep.log 2>&1 || true
          # THE money-path probe. It submits a synthetic lead through
          # /api/leads/submit, the route every live surface posts to, and deletes
          # it. It replaced property_synthetic_lead_check.mjs (retired 2026-08-16),
          # which inserted straight into PostgREST as the old ResourceGate did and
          # so had been passing green on a path nothing uses since that gate was
          # retired. The tripwire emails nobody and only goes red on a verified P0,
          # so this log is also where a standing flatline gets a reader; its
          # verdict line says whether the probe already cleared it as a false alarm.
          python scripts/lead_capture_tripwire.py > out/probes/tripwire.log 2>&1 || true
          tail -5 out/probes/health_sweep.log
          tail -12 out/probes/tripwire.log

      - name: Write the verdict from the facts (no LLM)
        # Was `claude -p` reading .github/caretaker/PROMPT.md. Retired 2026-09-01:
        # the CLI needs a CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`, that
        # token lapsed, the CLI fell back to ANTHROPIC_API_KEY, and the account has
        # no API credits (memory: anthropic_api_no_credit_subscription_only), so
        # every run wrote "Credit balance is too low" into verdict.md and went red.
        #
        # This step is a straight render of what state_check and the probes already
        # found. It emits no "EMAIL: yes" line, so the email step below stays
        # silent by construction and a red run remains the only signal, which is
        # what the step it replaced did in practice anyway.
        #
        # It must always produce a non-empty out/verdict.md: the dead-man ping
        # below gates on that file, so an empty one would tell Better Stack the
        # caretaker had died and would generate a new alert.
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = ["# Caretaker verdict", ""]
          try:
              run = json.loads(Path("out/run.json").read_text(encoding="utf-8"))
          except Exception as e:
              run = {}
              out.append(f"state_check produced no readable JSON: {e}")

          findings = run.get("findings", [])
          bad = [f for f in findings if f.get("status") in ("ALARM", "BLIND")]
          out.append(f"generated: {run.get('generated', 'unknown')}")
          out.append(f"findings: {len(findings)}, needing attention: {len(bad)}")
          out.append("")
          if bad:
              out.append("## Needs a look")
              for f in bad:
                  out.append(f"- {f.get('status')} {f.get('lane')} {f.get('name')}: {f.get('detail', '')}")
          else:
              out.append("No ALARM or BLIND findings.")
          out.append("")

          for log in ("out/probes/health_sweep.log", "out/probes/tripwire.log"):
              p = Path(log)
              out.append(f"## {p.name}")
              tail = p.read_text(encoding="utf-8", errors="replace").splitlines()[-12:] if p.exists() else ["(missing)"]
              out.extend(tail)
              out.append("")

          Path("out/verdict.md").write_text("\n".join(out) + "\n", encoding="utf-8")
          print("\n".join(out[:30]))
          PY

      - name: Email verdict when its finding set changed
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          TRIPWIRE_NOTIFY_TO: ${{ secrets.TRIPWIRE_NOTIFY_TO }}
        run: |
          python - <<'PY'
          import json, os, sys, datetime as dt
          from pathlib import Path
          import httpx
          v = Path("out/verdict.md")
          if not v.exists():
              print("no verdict (claude step failed); red run is the signal"); sys.exit(0)
          lines = v.read_text(encoding="utf-8").splitlines()
          send = any(l.strip() == "EMAIL: yes" for l in lines[:3])
          key = next((l.split(":", 1)[1].strip() for l in lines[:3] if l.startswith("KEY:")), "")
          state_p = Path("out/caretaker_last_key.json")
          prev = {}
          if state_p.exists():
              try: prev = json.loads(state_p.read_text())
              except Exception: pass
          if not send:
              print("caretaker: EMAIL: no"); sys.exit(0)
          if key and key == prev.get("key"):
              print("caretaker: same finding set as last email; suppressed"); sys.exit(0)
          api, to, frm = (os.environ.get(k, "").strip() for k in
                          ("RESEND_API_KEY", "TRIPWIRE_NOTIFY_TO", "RESEND_FROM_EMAIL"))
          if not (api and to and frm):
              print("caretaker: would email but Resend secrets missing"); sys.exit(0)
          r = httpx.post("https://api.resend.com/emails",
                         headers={"Authorization": f"Bearer {api}"},
                         json={"from": frm, "to": [to],
                               "subject": "[caretaker] weekly verdict",
                               "text": v.read_text(encoding="utf-8")}, timeout=30)
          print("send", r.status_code, r.text[:150])
          if r.status_code < 300:
              state_p.write_text(json.dumps(
                  {"key": key, "at": dt.datetime.now(dt.timezone.utc).isoformat()}))
          PY

      - name: Dead-man ping (silence at Better Stack = caretaker died)
        if: always()
        env:
          HEARTBEAT_CARETAKER: ${{ secrets.HEARTBEAT_CARETAKER }}
        run: |
          if [ -s out/verdict.md ] && [ -n "$HEARTBEAT_CARETAKER" ]; then
            curl -fsS --max-time 10 "$HEARTBEAT_CARETAKER" || true
          fi

      - name: Keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caretaker-verdict
          path: |
            out/verdict.md
            out/probes/*.log
          retention-days: 90
