name: Lead-capture tripwire

# Early-warning monitor for the Property lead-capture path. Runs every 6 hours.
# - Bundle check: catches the 2026-06-24 class (corrupted NEXT_PUBLIC_SUPABASE_*
#   baked into the live JS), deterministically.
# - Flatline heuristic: form-starts but zero submits. A SUSPICION only.
# - Probe: when the heuristic trips, submits a synthetic lead through the real
#   route and lets that decide. Healthy probe = false alarm, run stays green.
#
# SENDS NO EMAIL (2026-08-16). It went red 4x/day through a normal quiet weekend
# and every notice was content-free, so notification moved to the layer that can
# reason: the weekly caretaker re-runs this and dedups. Per-run detail lives in
# the run's step summary. A red run here now means one thing only: capture is
# verified broken.
#
# Required secrets: SUPABASE_URL, SUPABASE_KEY (already used by other workflows).

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours, on the hour (UTC)
  workflow_dispatch: {}

jobs:
  tripwire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet httpx
      - name: Run lead-capture tripwire
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/lead_capture_tripwire.py
      - name: Dead-man ping (silence at Better Stack = this workflow died)
        # Runs even when the tripwire TRIPS (a tripped check still proves the
        # monitor is alive; the trip itself emails separately). Only a crashed
        # or never-scheduled run stays silent - which is exactly the alert.
        if: always()
        env:
          HEARTBEAT_TRIPWIRE: ${{ secrets.HEARTBEAT_TRIPWIRE }}
        run: |
          if [ -n "$HEARTBEAT_TRIPWIRE" ]; then
            curl -fsS --max-time 10 "$HEARTBEAT_TRIPWIRE" || true
          fi
